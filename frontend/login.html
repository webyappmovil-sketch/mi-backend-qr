<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Registro – QR SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        brand: { 50:'#f0fdf4',100:'#dcfce7',500:'#22c55e',600:'#16a34a',700:'#15803d' }
      }}}
    }
  </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-xl mx-auto mb-3">Q</div>
      <h1 class="text-2xl font-bold text-slate-900">QR SaaS</h1>
      <p class="text-sm text-slate-500 mt-1">Acceso a tu cuenta</p>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
      <!-- Tabs Login / Registro -->
      <div class="flex gap-2 mb-6">
        <button id="tab-login" onclick="setMode('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-brand-50 text-brand-700 border-2 border-brand-500">Iniciar sesión</button>
        <button id="tab-registro" onclick="setMode('registro')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 border-2 border-transparent hover:bg-slate-50">Registrarse</button>
      </div>

      <form id="form-auth" onsubmit="handleAuth(event)" class="space-y-4">
        <div id="campo-nombre" class="hidden">
          <label class="block text-sm font-medium mb-1">Nombre del local</label>
          <input type="text" id="input-nombre" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="Mi Restaurante S.L.">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Email</label>
          <input type="email" id="input-email" required class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="tu@email.com">
        </div>
                <div>
          <label class="block text-sm font-medium mb-1">Contraseña</label>
          <div class="relative">
            <input type="password" id="input-password" required minlength="6" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 pr-12 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="••••••••">
            <button type="button" onclick="verClave('input-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs font-semibold">ver</button>
          </div>
        </div>
        <div id="campo-repetir" class="hidden">
          <label class="block text-sm font-medium mb-1">Repetir contraseña</label>
          <div class="relative">
            <input type="password" id="input-password2" minlength="6" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 pr-12 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="••••••••">
            <button type="button" onclick="verClave('input-password2', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs font-semibold">ver</button>
          </div>
        </div>
        <div id="campo-telefono" class="hidden">
          <label class="block text-sm font-medium mb-1">WhatsApp comercial (sin +)</label>
          <input type="text" id="input-telefono" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="34600111222">
        </div>
        <p id="auth-error" class="hidden text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2"></p>
        <button type="submit" id="btn-auth" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-xl transition">Continuar</button>
      </form>

      <p class="text-xs text-slate-400 mt-5 text-center leading-relaxed">
        Demo negocio: <strong>terraza@ejemplo.com</strong> / <strong>Negocio123!</strong><br>
        Admin: <strong>admin@qrsas.es</strong> / <strong>Admin123!</strong>
      </p>
    </div>

    <p class="text-center mt-6">
      <a href="index.html" class="text-sm text-slate-500 hover:text-brand-600">← Volver al inicio</a>
    </p>
  </div>

  <script>
       const API_BASE_OVERRIDE = 'https://plataforma-qr-backend.onrender.com';
    const API_BASE = (
      location.hostname === 'localhost' || location.protocol === 'file:'
        ? 'http://localhost:3000'
        : API_BASE_OVERRIDE
    );

    const Auth = {
      login(data) {
        sessionStorage.setItem('qr_saas_token', data.token);
        sessionStorage.setItem('qr_saas_user', JSON.stringify(data.user));
      },
      getUser() {
        try { return JSON.parse(sessionStorage.getItem('qr_saas_user')); } catch { return null; }
      },
      isLoggedIn() {
        return !!(sessionStorage.getItem('qr_saas_token') && this.getUser());
      }
    };

    if (Auth.isLoggedIn()) {
      const u = Auth.getUser();
      location.href = u.role === 'admin' ? 'admin.html' : 'dashboard.html';
    }

    let mode = 'login';
    function verClave(id, btn) {
      const input = document.getElementById(id);
      const mostrar = input.type === 'password';
      input.type = mostrar ? 'text' : 'password';
      btn.textContent = mostrar ? 'ocultar' : 'ver';
    }
    function setMode(m) {
      mode = m;
      const isReg = m === 'registro';
      document.getElementById('campo-nombre').classList.toggle('hidden', !isReg);
      document.getElementById('campo-telefono').classList.toggle('hidden', !isReg);
            document.getElementById('campo-repetir').classList.toggle('hidden', !isReg);
      document.getElementById('input-password2').required = isReg;
      document.getElementById('tab-login').className = isReg
        ? 'flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 border-2 border-transparent hover:bg-slate-50'
        : 'flex-1 py-2 text-sm font-semibold rounded-lg bg-brand-50 text-brand-700 border-2 border-brand-500';
      document.getElementById('tab-registro').className = isReg
        ? 'flex-1 py-2 text-sm font-semibold rounded-lg bg-brand-50 text-brand-700 border-2 border-brand-500'
        : 'flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 border-2 border-transparent hover:bg-slate-50';
      document.getElementById('auth-error').classList.add('hidden');
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('input-email').value.trim();
      const password = document.getElementById('input-password').value;
      const errEl = document.getElementById('auth-error');
      const btn = document.getElementById('btn-auth');
      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Espera…';

      try {
        let body, path;
        if (mode === 'registro') {
          const nombre = document.getElementById('input-nombre').value.trim();
          const telefono = document.getElementById('input-telefono').value.trim();
          if (!nombre || !telefono) throw new Error('Completa nombre y teléfono WhatsApp');
                    const password2 = document.getElementById('input-password2').value;
          if (password !== password2) throw new Error('Las contraseñas no coinciden');
          path = '/api/auth/registro';
          body = { nombre_empresa: nombre, email, password, telefono_whatsapp: telefono };
        } else {
          path = '/api/auth/login';
          body = { email, password };
        }

        const res = await fetch(API_BASE + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error de autenticación');

        Auth.login(data);
        location.href = data.user.role === 'admin' ? 'admin.html' : 'dashboard.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Continuar';
      }
    }
  </script>
</body>
</html>
