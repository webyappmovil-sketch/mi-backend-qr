<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago exitoso – QR SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl border border-slate-200 p-8 max-w-md w-full text-center shadow-sm">
    <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-4 text-3xl">✅</div>
    <h1 class="text-xl font-bold text-slate-900 mb-2">¡Pago recibido!</h1>
    <p class="text-slate-600 text-sm mb-6">
      Tu cuenta se activará en unos segundos cuando Stripe confirme el pago.
      Si pagaste la impresión, tu QR digital ya debería estar activo.
    </p>
    <a href="dashboard.html" class="inline-block bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-2.5 rounded-xl transition">
      Ir al panel
    </a>
    <p class="text-xs text-slate-400 mt-4">Si el estado no cambia, cierra sesión y vuelve a entrar.</p>
  </div>
  <script>
    // Refrescar datos de sesión si hay token
    const API_BASE = (location.hostname === 'localhost' || location.protocol === 'file:')
      ? 'http://localhost:3000' : '';
    (async () => {
      const token = sessionStorage.getItem('qr_saas_token');
      if (!token) return;
      try {
        const res = await fetch(API_BASE + '/api/auth/me', {
          headers: { Authorization: 'Bearer ' + token }
        });
        if (res.ok) {
          const data = await res.json();
          sessionStorage.setItem('qr_saas_user', JSON.stringify(data.user));
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
